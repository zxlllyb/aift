<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Junseong's Pro Study & Hoop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #000; overflow-x: hidden; -webkit-user-select: none; user-select: none; }
        canvas { touch-action: none; cursor: crosshair; }
        .zinc-card { background: #18181b; border: 1px solid #27272a; border-radius: 1.5rem; }
        /* 스크롤바 숨기기 */
        ::-webkit-scrollbar { width: 0px; }
    </style>
</head>
<body class="text-white font-sans p-6">

    <div class="max-w-6xl mx-auto flex flex-col md:flex-row gap-6">
        
        <div class="w-full md:w-5/12 space-y-6">
            <div class="zinc-card p-6 shadow-2xl">
                <h1 class="text-zinc-500 text-xs font-bold tracking-widest uppercase mb-4">Focus Timer</h1>
                <select id="subjectSelect" class="bg-zinc-800 text-white text-sm rounded-xl px-4 py-3 mb-4 w-full outline-none border border-zinc-700 focus:border-white transition-all">
                    <option value="국어">📚 국어</option>
                    <option value="수학">📐 수학</option>
                    <option value="영어">🌎 영어</option>
                    <option value="코딩">💻 코딩</option>
                </select>
                <div id="timer" class="text-7xl font-extralight mb-6 tracking-tighter text-center">00:00:00</div>
                <button id="mainBtn" class="w-full py-4 bg-white text-black rounded-2xl font-bold hover:bg-zinc-200 transition-all text-lg">공부 시작</button>
                <div id="history" class="mt-6 space-y-2 text-[11px] text-zinc-400 max-h-40 overflow-y-auto"></div>
            </div>

            <div class="zinc-card p-6 shadow-2xl">
                <h2 class="text-zinc-500 text-xs font-bold uppercase mb-4 tracking-widest">Analysis</h2>
                <div class="aspect-square">
                    <canvas id="studyChart"></canvas>
                </div>
            </div>
        </div>

        <div class="w-full md:w-7/12">
            <div class="zinc-card p-4 h-full flex flex-col relative overflow-hidden">
                <div class="flex justify-between items-center mb-4 px-2">
                    <div>
                        <h2 class="text-white text-lg font-bold uppercase tracking-widest">Hoop Master</h2>
                        <p class="text-xs text-zinc-500">공을 당겨서 궤적을 조절하세요!</p>
                    </div>
                    <div class="text-right">
                        <span class="text-zinc-500 text-xs">SCORE</span>
                        <div id="scoreDisplay" class="text-4xl font-black text-white">0</div>
                    </div>
                </div>
                
                <div class="flex-grow bg-zinc-900/50 rounded-2xl relative border border-zinc-800/50">
                    <canvas id="gameCanvas"></canvas>
                </div>
                <button onclick="resetGame()" class="mt-4 text-xs text-zinc-600 hover:text-white transition-colors uppercase font-bold tracking-tighter">Reset Game Session</button>
            </div>
        </div>

    </div>

    <script>
        // --- [공통 변수] ---
        let seconds = 0, timerId = null, myChart = null;
        const display = document.getElementById('timer'), btn = document.getElementById('mainBtn');

        // --- [데이터 로직] ---
        function format(s) { return new Date(s * 1000).toISOString().substr(11, 8); }

        async function loadData() {
            try {
                const hRes = await fetch('/api/history');
                const hData = await hRes.json();
                document.getElementById('history').innerHTML = hData.map(i => 
                    `<div class="flex justify-between border-b border-zinc-800 pb-1"><span>${i.subject}</span><span class="text-white font-mono">${format(i.duration_seconds)}</span></div>`).join('');

                const cRes = await fetch('/api/chart-data');
                const cData = await cRes.json();
                const ctx = document.getElementById('studyChart');
                if(myChart) myChart.destroy();
                myChart = new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: cData.map(i => i.subject),
                        datasets: [{ data: cData.map(i => i.total_seconds), backgroundColor: ['#fff', '#a1a1aa', '#52525b', '#27272a'], borderWidth: 0 }]
                    },
                    options: { plugins: { legend: { position: 'bottom', labels: { color: '#71717a', usePointStyle: true } } } }
                });
            } catch (e) { console.log("서버 연결 대기 중..."); }
        }

        btn.onclick = async () => {
            if (!timerId) {
                timerId = setInterval(() => { seconds++; display.innerText = format(seconds); }, 1000);
                btn.innerText = "집중 종료 및 저장";
                btn.className = "w-full py-4 bg-red-600 text-white rounded-2xl font-bold transition-all text-lg";
            } else {
                clearInterval(timerId);
                const subject = document.getElementById('subjectSelect').value;
                await fetch('/api/save', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ duration: seconds, subject })
                });
                seconds = 0; timerId = null;
                display.innerText = "00:00:00";
                btn.innerText = "공부 시작";
                btn.className = "w-full py-4 bg-white text-black rounded-2xl font-bold transition-all text-lg";
                loadData();
            }
        };

        // --- [고급 농구 게임 로직] ---
        const canvas = document.getElementById('gameCanvas'), gCtx = canvas.getContext('2d');
        function resize() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let score = 0;
        let ball = { x: 80, y: 0, r: 15, vx: 0, vy: 0, shooting: false };
        let hoop = { x: 0, y: 0, w: 60, h: 8 };
        let isDragging = false, mouseX, mouseY;

        function initPositions() {
            ball.x = 100; ball.y = canvas.height - 100;
            hoop.x = canvas.width - 120; hoop.y = 150;
            ball.shooting = false;
        }
        initPositions();

        canvas.onmousedown = (e) => {
            if (!ball.shooting) {
                const dist = Math.hypot(e.offsetX - ball.x, e.offsetY - ball.y);
                if (dist < 30) { isDragging = true; mouseX = e.offsetX; mouseY = e.offsetY; }
            }
        };

        window.onmousemove = (e) => { if(isDragging) { mouseX = e.offsetX; mouseY = e.offsetY; } };

        window.onmouseup = (e) => {
            if (isDragging) {
                ball.vx = (ball.x - e.offsetX) * 0.12;
                ball.vy = (ball.y - e.offsetY) * 0.12;
                ball.shooting = true; isDragging = false;
            }
        };

        function draw() {
            gCtx.clearRect(0, 0, canvas.width, canvas.height);

            // 골대
            gCtx.fillStyle = "#ef4444";
            gCtx.fillRect(hoop.x - hoop.w/2, hoop.y, hoop.w, hoop.h);
            gCtx.fillStyle = "rgba(239, 68, 68, 0.2)";
            gCtx.fillRect(hoop.x - hoop.w/2, hoop.y + hoop.h, hoop.h, 40); // 넷 느낌
            gCtx.fillRect(hoop.x + hoop.w/2 - hoop.h, hoop.y + hoop.h, hoop.h, 40);

            // 가이드 궤적 (점선)
            if (isDragging) {
                gCtx.beginPath();
                gCtx.setLineDash([5, 5]);
                let tx = ball.x, ty = ball.y;
                let tvx = (ball.x - mouseX) * 0.12;
                let tvy = (ball.y - mouseY) * 0.12;
                for (let i = 0; i < 30; i++) {
                    gCtx.lineTo(tx, ty);
                    tx += tvx; ty += tvy; tvy += 0.25;
                }
                gCtx.strokeStyle = "rgba(255,255,255,0.3)";
                gCtx.stroke();
                gCtx.setLineDash([]);
            }

            // 공
            gCtx.beginPath();
            gCtx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2);
            gCtx.fillStyle = ball.shooting ? "#fff" : "#fb923c";
            gCtx.shadowBlur = 15; gCtx.shadowColor = ball.shooting ? "#fff" : "#fb923c";
            gCtx.fill();
            gCtx.shadowBlur = 0;

            if (ball.shooting) {
                ball.x += ball.vx; ball.y += ball.vy; ball.vy += 0.25;
                // 골인 판정
                if (ball.y > hoop.y && ball.y < hoop.y + 15 && ball.x > hoop.x - hoop.w/2 && ball.x < hoop.x + hoop.w/2 && ball.vy > 0) {
                    score++; document.getElementById('scoreDisplay').innerText = score;
                    ball.vy = -2; // 튕기는 효과
                    setTimeout(initPositions, 500);
                }
                // 리셋 조건
                if (ball.y > canvas.height + 50 || ball.x > canvas.width + 50 || ball.x < -50) initPositions();
            }
            requestAnimationFrame(draw);
        }

        function resetGame() { score = 0; document.getElementById('scoreDisplay').innerText = "0"; initPositions(); }

        draw();
        loadData();
    </script>
</body>
</html>
