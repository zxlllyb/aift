<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Junseong's Elite Study & Hoop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #000; overflow: hidden; -webkit-user-select: none; user-select: none; }
        canvas { touch-action: none; cursor: crosshair; }
        .zinc-card { background: #111113; border: 1px solid #27272a; border-radius: 2rem; }
    </style>
</head>
<body class="text-white font-sans p-6 h-screen flex items-center justify-center">

    <div class="max-w-7xl w-full flex flex-col md:flex-row gap-6 h-[90vh]">
        
        <div class="w-full md:w-4/12 flex flex-col gap-6 h-full">
            <div class="zinc-card p-6 flex-shrink-0">
                <h1 class="text-zinc-500 text-xs font-bold tracking-widest uppercase mb-4">Focus Timer</h1>
                <select id="subjectSelect" class="bg-zinc-800 text-white text-sm rounded-xl px-4 py-3 mb-4 w-full outline-none border border-zinc-700">
                    <option value="국어">📚 국어</option>
                    <option value="수학">📐 수학</option>
                    <option value="영어">🌎 영어</option>
                    <option value="코딩">💻 코딩</option>
                </select>
                <div id="timer" class="text-6xl font-extralight mb-6 tracking-tighter text-center font-mono">00:00:00</div>
                <button id="mainBtn" class="w-full py-4 bg-white text-black rounded-2xl font-bold hover:scale-[0.98] transition-all">공부 시작</button>
            </div>
            <div class="zinc-card p-6 flex-grow flex flex-col">
                <h2 class="text-zinc-500 text-xs font-bold uppercase mb-4 tracking-widest">Study Analysis</h2>
                <div class="flex-grow flex items-center"><canvas id="studyChart"></canvas></div>
                <div id="history" class="mt-4 space-y-1 text-[10px] text-zinc-500 max-h-24 overflow-y-auto"></div>
            </div>
        </div>

        <div class="w-full md:w-8/12 h-full">
            <div class="zinc-card p-6 h-full flex flex-col relative overflow-hidden bg-zinc-900/20">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-2xl font-black italic text-orange-500">HOOP MASTER</h2>
                    <div class="bg-zinc-800 px-6 py-1 rounded-full border border-zinc-700">
                        <span class="text-zinc-500 text-[10px] uppercase mr-2">Score</span>
                        <span id="scoreDisplay" class="text-2xl font-black text-white">0</span>
                    </div>
                </div>
                
                <div class="flex-grow bg-black rounded-3xl relative border border-zinc-800 shadow-inner overflow-hidden">
                    <canvas id="gameCanvas"></canvas>
                    <div class="absolute bottom-4 left-4 text-zinc-600 text-[10px] uppercase font-bold">Drag Ball Backwards to Shoot</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // [서버 연동 로직은 기존과 동일하되 에러 방지 처리]
        let seconds = 0, timerId = null, myChart = null;
        const display = document.getElementById('timer'), btn = document.getElementById('mainBtn');

        async function loadData() {
            try {
                const hRes = await fetch('/api/history'); const hData = await hRes.json();
                document.getElementById('history').innerHTML = hData.map(i => `<div class="flex justify-between border-b border-zinc-800 pb-1"><span>${i.subject}</span><span>${i.duration_seconds}s</span></div>`).join('');
                const cRes = await fetch('/api/chart-data'); const cData = await cRes.json();
                if(myChart) myChart.destroy();
                myChart = new Chart(document.getElementById('studyChart'), {
                    type: 'doughnut', data: { labels: cData.map(i => i.subject), datasets: [{ data: cData.map(i => i.total_seconds), backgroundColor: ['#fff','#666','#333','#999'], borderWidth: 0 }] },
                    options: { plugins: { legend: { position: 'bottom', labels: { color: '#555', font: { size: 10 } } } } }
                });
            } catch (e) { console.log("Server not connected yet"); }
        }

        btn.onclick = async () => {
            if (!timerId) {
                timerId = setInterval(() => { seconds++; display.innerText = new Date(seconds * 1000).toISOString().substr(11, 8); }, 1000);
                btn.innerText = "저장 및 종료"; btn.className = "w-full py-4 bg-orange-600 text-white rounded-2xl font-bold transition-all";
            } else {
                clearInterval(timerId);
                const subject = document.getElementById('subjectSelect').value;
                await fetch('/api/save', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ duration: seconds, subject }) });
                seconds = 0; timerId = null; display.innerText = "00:00:00"; btn.innerText = "공부 시작"; btn.className = "w-full py-4 bg-white text-black rounded-2xl font-bold transition-all";
                loadData();
            }
        };

        // --- [농구 게임 엔지니어링] ---
        const canvas = document.getElementById('gameCanvas'), gCtx = canvas.getContext('2d');
        let score = 0, particles = [];
        let ball = { x: 0, y: 0, r: 18, vx: 0, vy: 0, shooting: false, trail: [] };
        let hoop = { x: 0, y: 0, w: 70, h: 8, bX: 0, bY: 0, bW: 10, bH: 100 };
        let isDragging = false, startX, startY;

        function resize() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
            initPositions();
        }

        function initPositions() {
            // 핵심 수정: 공을 화면 왼쪽 중간 높이(height * 0.6)로 배치해서 아래/뒤로 당길 공간 확보
            ball.x = 120; 
            ball.y = canvas.height * 0.65; 
            ball.vx = 0; ball.vy = 0; ball.shooting = false; ball.trail = [];
            // 골대 위치 조정
            hoop.x = canvas.width - 140; hoop.y = 180;
            hoop.bX = hoop.x + hoop.w / 2; hoop.bY = hoop.y - 80;
        }

        canvas.onmousedown = (e) => {
            if (!ball.shooting) {
                const dist = Math.hypot(e.offsetX - ball.x, e.offsetY - ball.y);
                if (dist < 40) { isDragging = true; startX = ball.x; startY = ball.y; }
            }
        };

        window.onmousemove = (e) => {
            if (isDragging) {
                // 공이 마우스를 따라오게 해서 시각적 피드백 강화
                ball.x = e.offsetX; ball.y = e.offsetY;
            }
        };

        window.onmouseup = (e) => {
            if (isDragging) {
                ball.vx = (startX - e.offsetX) * 0.14; // 파워 살짝 상향
                ball.vy = (startY - e.offsetY) * 0.14;
                ball.x = startX; ball.y = startY; // 발사 위치는 원래 자리에서
                ball.shooting = true; isDragging = false;
            }
        };

        function draw() {
            gCtx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. 골대 & 백보드
            gCtx.fillStyle = "#333"; gCtx.fillRect(hoop.bX, hoop.bY, hoop.bW, hoop.bH);
            gCtx.fillStyle = "#ef4444"; gCtx.fillRect(hoop.x - hoop.w/2, hoop.y, hoop.w, hoop.h);

            // 2. 가이드라인 (당길 때 예상 궤적)
            if (isDragging) {
                gCtx.beginPath(); gCtx.setLineDash([5, 5]);
                let tx = startX, ty = startY, tvx = (startX - ball.x) * 0.14, tvy = (startY - ball.y) * 0.14;
                gCtx.moveTo(tx, ty);
                for (let i = 0; i < 30; i++) {
                    tx += tvx; ty += tvy; tvy += 0.25; gCtx.lineTo(tx, ty);
                }
                gCtx.strokeStyle = "rgba(251, 146, 60, 0.5)"; gCtx.stroke(); gCtx.setLineDash([]);
            }

            // 3. 공 잔상
            if (ball.shooting) {
                ball.trail.push({x: ball.x, y: ball.y});
                if(ball.trail.length > 10) ball.trail.shift();
                ball.trail.forEach((t, i) => {
                    gCtx.beginPath(); gCtx.arc(t.x, t.y, ball.r * (i/10), 0, Math.PI*2);
                    gCtx.fillStyle = `rgba(251, 146, 60, ${i/20})`; gCtx.fill();
                });
            }

            // 4. 공 본체
            gCtx.beginPath(); gCtx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2);
            gCtx.fillStyle = isDragging ? "#fb923c" : "#fff";
            gCtx.shadowBlur = 20; gCtx.shadowColor = "#fb923c"; gCtx.fill(); gCtx.shadowBlur = 0;

            // 5. 물리 엔진
            if (ball.shooting) {
                ball.x += ball.vx; ball.y += ball.vy; ball.vy += 0.25; // 중력
                // 백보드 충돌
                if (ball.x + ball.r > hoop.bX && ball.y > hoop.bY && ball.y < hoop.bY + hoop.bH) {
                    ball.vx *= -0.6; ball.x = hoop.bX - ball.r;
                }
                // 골인 판정
                if (ball.y > hoop.y && ball.y < hoop.y + 15 && ball.x > hoop.x - hoop.w/2 && ball.x < hoop.x + hoop.w/2 && ball.vy > 0) {
                    score++; document.getElementById('scoreDisplay').innerText = score;
                    ball.vy = 2; // 그물을 통과하는 듯한 연출
                    setTimeout(initPositions, 600);
                }
                // 리셋
                if (ball.y > canvas.height + 50 || ball.x < -50 || ball.x > canvas.width + 50) initPositions();
            }

            requestAnimationFrame(draw);
        }

        window.addEventListener('resize', resize);
        resize(); draw(); loadData();
    </script>
</body>
</html>
