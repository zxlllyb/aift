<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Focus & Hoop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-black text-white flex flex-col items-center py-10 font-sans">

    <div class="bg-zinc-900 p-8 rounded-[2.5rem] border border-zinc-800 text-center w-80 mb-6">
        <select id="subjectSelect" class="bg-zinc-800 text-white text-sm rounded-xl px-4 py-2 mb-4 w-full outline-none">
            <option value="국어">국어</option>
            <option value="수학">수학</option>
            <option value="영어">영어</option>
            <option value="코딩">코딩</option>
        </select>
        <div id="timer" class="text-6xl font-light mb-6">00:00:00</div>
        <button id="mainBtn" class="w-full py-4 bg-white text-black rounded-2xl font-bold">시작</button>
        <div id="history" class="mt-6 text-[10px] text-zinc-500 max-h-24 overflow-y-auto"></div>
    </div>

    <div class="bg-zinc-900 p-6 rounded-[2rem] border border-zinc-800 w-80 mb-6">
        <canvas id="studyChart"></canvas>
    </div>

    <div class="bg-zinc-900 p-4 rounded-[2rem] border border-zinc-800 w-80 text-center">
        <p class="text-[10px] mb-2 text-zinc-500">클릭하면 공이 날아갑니다!</p>
        <canvas id="gameCanvas" width="280" height="200" class="bg-zinc-800 rounded-xl"></canvas>
        <div class="mt-2 text-xl font-bold" id="scoreDisplay">Score: 0</div>
    </div>

    <script>
        let seconds = 0, timerId = null, myChart = null;
        const display = document.getElementById('timer'), btn = document.getElementById('mainBtn');

        // 1. 타이머 & 데이터 로직
        function format(s) { return new Date(s * 1000).toISOString().substr(11, 8); }

        async function loadData() {
            try {
                const hRes = await fetch('/api/history');
                const hData = await hRes.json();
                document.getElementById('history').innerHTML = hData.map(i => 
                    `<div class="flex justify-between border-b border-zinc-800"><span>${i.subject}</span><span>${format(i.duration_seconds)}</span></div>`).join('');

                const cRes = await fetch('/api/chart-data');
                const cData = await cRes.json();
                const ctx = document.getElementById('studyChart');
                if(myChart) myChart.destroy();
                myChart = new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: cData.map(i => i.subject),
                        datasets: [{ data: cData.map(i => i.total_seconds), backgroundColor: ['#fff', '#666', '#333', '#999'], borderWidth: 0 }]
                    }
                });
            } catch (e) { console.log("로드 대기 중..."); }
        }

        btn.onclick = async () => {
            if (!timerId) {
                timerId = setInterval(() => { seconds++; display.innerText = format(seconds); }, 1000);
                btn.innerText = "종료";
                btn.style.backgroundColor = "red"; btn.style.color = "white";
            } else {
                clearInterval(timerId);
                const subject = document.getElementById('subjectSelect').value;
                await fetch('/api/save', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ duration: seconds, subject })
                });
                seconds = 0; timerId = null;
                display.innerText = "00:00:00";
                btn.innerText = "시작";
                btn.style.backgroundColor = "white"; btn.style.color = "black";
                loadData();
            }
        };

        // 2. 초간단 농구 게임 (클릭하면 슛)
        const canvas = document.getElementById('gameCanvas'), gCtx = canvas.getContext('2d');
        let score = 0, ball = { x: 140, y: 180, vy: 0, shooting: false };

        canvas.onclick = () => { if(!ball.shooting) { ball.vy = -8; ball.shooting = true; } };

        function draw() {
            gCtx.clearRect(0, 0, canvas.width, canvas.height);
            // 골대
            gCtx.fillStyle = "red"; gCtx.fillRect(115, 40, 50, 5);
            // 공
            gCtx.fillStyle = "white"; gCtx.beginPath(); gCtx.arc(ball.x, ball.y, 10, 0, Math.PI*2); gCtx.fill();

            if (ball.shooting) {
                ball.y += ball.vy; ball.vy += 0.2;
                if (ball.y < 50 && ball.x > 115 && ball.x < 165) { score++; document.getElementById('scoreDisplay').innerText = "Score: " + score; ball.y = 250; }
                if (ball.y > 200) { ball.y = 180; ball.shooting = false; }
            }
            requestAnimationFrame(draw);
        }

        draw();
        loadData();
    </script>
</body>
</html>
