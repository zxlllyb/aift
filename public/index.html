<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Junseong's Elite Study & Hoop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #000; overflow: hidden; -webkit-user-select: none; user-select: none; }
        canvas { touch-action: none; cursor: crosshair; }
        .zinc-card { background: #111113; border: 1px solid #27272a; border-radius: 2rem; }
        @keyframes net-shake {
            0% { transform: scaleY(1); }
            50% { transform: scaleY(1.3) skewX(5deg); }
            100% { transform: scaleY(1); }
        }
    </style>
</head>
<body class="text-white font-sans p-6 h-screen flex items-center justify-center">

    <div class="max-w-7xl w-full flex flex-col md:flex-row gap-6 h-[90vh]">
        
        <div class="w-full md:w-4/12 flex flex-col gap-6 h-full">
            <div class="zinc-card p-6 flex-shrink-0">
                <h1 class="text-zinc-500 text-xs font-bold tracking-widest uppercase mb-4">Focus Timer</h1>
                <select id="subjectSelect" class="bg-zinc-800 text-white text-sm rounded-xl px-4 py-3 mb-4 w-full outline-none border border-zinc-700">
                    <option value="국어">📚 국어</option>
                    <option value="수학">📐 수학</option>
                    <option value="영어">🌎 영어</option>
                    <option value="코딩">💻 코딩</option>
                </select>
                <div id="timer" class="text-6xl font-extralight mb-6 tracking-tighter text-center font-mono">00:00:00</div>
                <button id="mainBtn" class="w-full py-4 bg-white text-black rounded-2xl font-bold hover:scale-[0.98] transition-all">공부 시작</button>
            </div>
            <div class="zinc-card p-6 flex-grow flex flex-col">
                <h2 class="text-zinc-500 text-xs font-bold uppercase mb-4 tracking-widest">Study Analysis</h2>
                <div class="flex-grow flex items-center"><canvas id="studyChart"></canvas></div>
                <div id="history" class="mt-4 space-y-1 text-[10px] text-zinc-500 max-h-24 overflow-y-auto"></div>
            </div>
        </div>

        <div class="w-full md:w-8/12 h-full">
            <div class="zinc-card p-6 h-full flex flex-col relative overflow-hidden bg-zinc-900/20">
                <div class="flex justify-between items-center mb-4">
                    <div class="flex items-baseline gap-3">
                        <h2 class="text-2xl font-black italic text-orange-500">HOOP MASTER</h2>
                        <span id="gameMode" class="text-[10px] text-zinc-500 font-bold px-2 py-0.5 border border-zinc-800 rounded">STATIONARY</span>
                    </div>
                    <div class="bg-zinc-800 px-6 py-1 rounded-full border border-zinc-700">
                        <span class="text-zinc-500 text-[10px] uppercase mr-2">Score</span>
                        <span id="scoreDisplay" class="text-2xl font-black text-white">0</span>
                    </div>
                </div>
                
                <div class="flex-grow bg-black rounded-3xl relative border border-zinc-800 shadow-inner overflow-hidden">
                    <canvas id="gameCanvas"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        // [서버 로직 생략 - 기존 유지]
        let seconds = 0, timerId = null, myChart = null;
        const display = document.getElementById('timer'), btn = document.getElementById('mainBtn');

        // [타이머 및 데이터 로딩 함수는 준성님 기존 코드 그대로 사용]
        async function loadData() { try { /* 기존 로직 */ } catch(e){} }

        // --- [농구 게임 고도화 엔진] ---
        const canvas = document.getElementById('gameCanvas'), gCtx = canvas.getContext('2d');
        let score = 0, particles = [];
        let ball = { x: 0, y: 0, r: 16, vx: 0, vy: 0, shooting: false, trail: [] };
        let hoop = { x: 0, y: 0, w: 65, h: 8, bX: 0, bY: 0, bW: 8, bH: 90, angle: 0 };
        let netFlash = 0; // 그물 흔들림 강도
        let isDragging = false, startX, startY;

        function resize() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
            initPositions();
        }

        function initPositions() {
            // 조작 편의성을 위해 공을 약간 높게 배치
            ball.x = 100; 
            ball.y = canvas.height * 0.6; 
            ball.vx = 0; ball.vy = 0; ball.shooting = false; ball.trail = [];
            
            // 골대 위치: 좀 더 멀게(우측 끝으로)
            hoop.x = canvas.width - 120;
            hoop.y = 200;
            hoop.bX = hoop.x + hoop.w / 2;
            hoop.bY = hoop.y - 70;
        }

        canvas.onmousedown = (e) => {
            if (!ball.shooting) {
                const dist = Math.hypot(e.offsetX - ball.x, e.offsetY - ball.y);
                if (dist < 40) { isDragging = true; startX = ball.x; startY = ball.y; }
            }
        };

        window.onmousemove = (e) => { if (isDragging) { ball.x = e.offsetX; ball.y = e.offsetY; } };

        window.onmouseup = (e) => {
            if (isDragging) {
                ball.vx = (startX - e.offsetX) * 0.15;
                ball.vy = (startY - e.offsetY) * 0.15;
                ball.x = startX; ball.y = startY;
                ball.shooting = true; isDragging = false;
            }
        };

        function drawNet(x, y, w, flash) {
            gCtx.beginPath();
            gCtx.strokeStyle = `rgba(255, 255, 255, ${0.3 + flash})`;
            gCtx.lineWidth = 1;
            // 그물 격자 그리기
            for(let i = 0; i <= 4; i++) {
                // 세로선
                gCtx.moveTo(x - w/2 + (w/4)*i, y);
                gCtx.lineTo(x - w/3 + (w/6)*i, y + 40 + (flash * 10));
                // 가로선
                gCtx.moveTo(x - w/2 + i*2, y + i*10);
                gCtx.lineTo(x + w/2 - i*2, y + i*10);
            }
            gCtx.stroke();
        }

        function draw() {
            gCtx.clearRect(0, 0, canvas.width, canvas.height);

            // 5점 이상이면 골대 이동 (무빙 바스켓 모드)
            if (score >= 5) {
                document.getElementById('gameMode').innerText = "MOVING MODE";
                document.getElementById('gameMode').classList.add('text-orange-500', 'border-orange-500');
                hoop.angle += 0.02;
                hoop.y = 200 + Math.sin(hoop.angle) * 50; // 위아래로 50px 이동
                hoop.bY = hoop.y - 70;
            }

            // 1. 백보드 & 골대
            gCtx.fillStyle = "#222"; gCtx.fillRect(hoop.bX, hoop.bY, hoop.bW, hoop.bH);
            
            // 2. 그물 (공이 들어가면 flash가 증가해서 흔들림)
            drawNet(hoop.x, hoop.y + hoop.h, hoop.w, netFlash);
            if(netFlash > 0) netFlash -= 0.05;

            // 3. 림 (골대 입구)
            gCtx.fillStyle = "#ef4444"; gCtx.fillRect(hoop.x - hoop.w/2, hoop.y, hoop.w, hoop.h);

            // 4. 가이드라인
            if (isDragging) {
                gCtx.beginPath(); gCtx.setLineDash([4, 4]);
                let tx = startX, ty = startY, tvx = (startX - ball.x) * 0.15, tvy = (startY - ball.y) * 0.15;
                for (let i = 0; i < 25; i++) {
                    gCtx.lineTo(tx, ty); tx += tvx; ty += tvy; tvy += 0.25;
                }
                gCtx.strokeStyle = "rgba(251, 146, 60, 0.4)"; gCtx.stroke(); gCtx.setLineDash([]);
            }

            // 5. 공 물리 및 잔상
            if (ball.shooting) {
                ball.trail.push({x: ball.x, y: ball.y});
                if(ball.trail.length > 8) ball.trail.shift();
                ball.trail.forEach((t, i) => {
                    gCtx.beginPath(); gCtx.arc(t.x, t.y, ball.r * (i/8), 0, Math.PI*2);
                    gCtx.fillStyle = `rgba(251, 146, 60, ${i/20})`; gCtx.fill();
                });

                ball.x += ball.vx; ball.y += ball.vy; ball.vy += 0.25;

                // 백보드 충돌
                if (ball.x + ball.r > hoop.bX && ball.y > hoop.bY && ball.y < hoop.bY + hoop.bH) {
                    ball.vx *= -0.7; ball.x = hoop.bX - ball.r;
                }

                // 골인 판정 (그물 흔들림 추가)
                if (ball.y > hoop.y && ball.y < hoop.y + 20 && ball.x > hoop.x - hoop.w/2 && ball.x < hoop.x + hoop.w/2 && ball.vy > 0) {
                    score++; netFlash = 1;
                    document.getElementById('scoreDisplay').innerText = score;
                    ball.vx *= 0.5; // 그물 저항 느낌
                    setTimeout(initPositions, 700);
                }

                if (ball.y > canvas.height + 50 || ball.x < -50 || ball.x > canvas.width + 50) initPositions();
            }

            // 6. 공 본체
            gCtx.beginPath(); gCtx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2);
            gCtx.fillStyle = isDragging ? "#fb923c" : "#fff";
            gCtx.shadowBlur = 15; gCtx.shadowColor = "#fb923c"; gCtx.fill(); gCtx.shadowBlur = 0;

            requestAnimationFrame(draw);
        }

        window.addEventListener('resize', resize);
        resize(); draw();
    </script>
</body>
</html>
