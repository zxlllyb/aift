<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>StudySync - 스마트 학습 플래너</title>
    <style>
        body { background-color: #0f172a; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .dashboard { background: #1e293b; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; width: 350px; }
        h1 { color: #00d1ff; margin-bottom: 10px; }
        .timer { font-size: 40px; font-weight: bold; margin: 20px 0; color: #f8fafc; border: 2px dashed #334155; padding: 10px; border-radius: 10px; }
        .btn { background: #00d1ff; color: #0f172a; border: none; padding: 12px 30px; border-radius: 10px; font-weight: bold; cursor: pointer; width: 100%; }
        .status { margin-top: 20px; font-size: 13px; color: #94a3b8; }
    </style>
</head>
<body>
    <div class="dashboard">
        <h1>StudySync</h1>
        <p>오늘의 집중 시간</p>
        <div class="timer" id="display">00:00:00</div>
        <button class="btn" onclick="startTimer()" id="mainBtn">공부 시작</button>
        <div class="status">사용자: <span id="userName">연결 중...</span></div>
    </div>
    <script>
        // 서버에서 이름 가져오기
        fetch('/api/user').then(res => res.json()).then(data => {
            document.getElementById('userName').innerText = data.name;
        });

        let seconds = 0;
        function startTimer() {
            const btn = document.getElementById('mainBtn');
            btn.disabled = true;
            btn.innerText = "열공 중!";
            setInterval(() => {
                seconds++;
                let h = Math.floor(seconds / 3600);
                let m = Math.floor((seconds % 3600) / 60);
                let s = seconds % 60;
                document.getElementById('display').innerText = 
                    `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
            }, 1000);
        }
    </script>
</body>
</html>
