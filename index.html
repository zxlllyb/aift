<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>StudySync - 스마트 학습 플래너</title>
    <style>
        body { background-color: #0f172a; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .dashboard { background: #1e293b; padding: 40px; border-radius: 20px; text-align: center; width: 350px; }
        .timer { font-size: 40px; font-weight: bold; margin: 20px 0; color: #00d1ff; }
        .btn { background: #00d1ff; color: #0f172a; border: none; padding: 12px; border-radius: 10px; font-weight: bold; cursor: pointer; width: 100%; margin-bottom: 10px; }
        .stop-btn { background: #ff4b5c; color: white; }
    </style>
</head>
<body>
    <div class="dashboard">
        <h1>StudySync</h1>
        <div class="timer" id="display">00:00:00</div>
        <button class="btn" onclick="startTimer()" id="startBtn">공부 시작</button>
        <button class="btn stop-btn" onclick="stopTimer()" id="stopBtn" style="display:none;">공부 중단 (저장)</button>
        <p id="status">사용자: <span id="userName">...</span></p>
    </div>

    <script>
        let seconds = 0;
        let timerInterval;
        let currentUserName = "";

        // 시작할 때 이름 불러오기
        fetch('/api/user').then(res => res.json()).then(data => {
            currentUserName = data.name;
            document.getElementById('userName').innerText = currentUserName;
        });

        function startTimer() {
            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('stopBtn').style.display = 'block';
            timerInterval = setInterval(() => {
                seconds++;
                let h = Math.floor(seconds / 3600);
                let m = Math.floor((seconds % 3600) / 60);
                let s = seconds % 60;
                document.getElementById('display').innerText = 
                    `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
            }, 1000);
        }

        async function stopTimer() {
            clearInterval(timerInterval);
            // 서버에 데이터 전송
            const response = await fetch('/api/save-session', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: currentUserName, duration: seconds })
            });
            
            if(response.ok) {
                alert(`총 ${seconds}초 공부 완료! DB에 저장되었습니다.`);
                location.reload(); // 페이지 새로고침
            }
        }
    </script>
</body>
</html>
